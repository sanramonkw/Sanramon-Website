# sanramonkw.com — host-level redirect + error-page config
#
# WHY THIS FILE EXISTS IN THE REPO
# The 301 map used to live only as prose in DEPLOYMENT.md, so it was never
# applied when the site moved to our own server (verified 2026-08-07: every
# old indexed URL returned 404). Keeping it as a version-controlled file means
# the next migration copies it instead of re-typing it from a document.
#
# Implements: DEPLOYMENT.md → "301 redirect map (Arabic-default promotion,
# 2026-07-12)", plus host canonicalisation and the custom 404 page.
#
# ---------------------------------------------------------------------------
# PART A — host canonicalisation  (put these in the http{} / server{} scope
#          shown; this part is NOT inside the main server block)
# ---------------------------------------------------------------------------
#
# Verified 2026-08-07: all four origins served identical content at 200 —
#   http://sanramonkw.com/         200
#   http://www.sanramonkw.com/     200
#   https://www.sanramonkw.com/    200
#   https://sanramonkw.com/        200
# The <link rel="canonical"> tag points at https://sanramonkw.com/, but that
# is only a hint to search engines; a 301 is a directive. Serving the site
# over plain http at 200 is also a security gap. The TLS certificate already
# covers www (https://www resolved without a cert error), so the redirect
# server block below is safe to add.

# A1. Redirect the www host to the apex, on both schemes.
#     Add as a SEPARATE server block, alongside the main one.
#
# server {
#     listen 80;
#     listen 443 ssl;
#     server_name www.sanramonkw.com;
#
#     # Reuse the same certificate paths as the main server block —
#     # it must cover www.sanramonkw.com (it currently does).
#     # ssl_certificate     /path/to/fullchain.pem;
#     # ssl_certificate_key /path/to/privkey.pem;
#
#     return 301 https://sanramonkw.com$request_uri;
# }

# A2. Force https on the apex host.
#     If TLS terminates in nginx itself, use a plain listen-80 server block:
#
# server {
#     listen 80;
#     server_name sanramonkw.com;
#     return 301 https://sanramonkw.com$request_uri;
# }
#
#     If TLS terminates in a proxy IN FRONT of nginx (likely here — nginx
#     emitted an http:// Location for its own trailing-slash redirect, which
#     means $scheme was "http" on an https request), then trust the forwarded
#     header instead. This `map` must sit in the http{} block, NOT in server{}:
#
# map $http_x_forwarded_proto $client_scheme {
#     default $http_x_forwarded_proto;
#     ""      $scheme;
# }
#
#     ...and then inside the main server block:
#
# if ($client_scheme != "https") {
#     return 301 https://sanramonkw.com$request_uri;
# }

# ---------------------------------------------------------------------------
# PART B — everything below goes INSIDE the main server{} block for
#          sanramonkw.com
# ---------------------------------------------------------------------------

# Keep the scheme on nginx's own trailing-slash redirects. Without this,
# /en/careers 301s to *http://*sanramonkw.com/en/careers/ — an extra hop that
# also drops to an insecure scheme. Relative Location headers are valid per
# RFC 7231 and are handled by every browser and by Googlebot.
absolute_redirect off;

# Serve the site's own Arabic 404 page instead of nginx's 153-byte default.
# The status stays 404 (no `=200`) — a "soft 404" returning 200 makes Google
# index the error page as real content. `internal` stops /404.html itself
# being reachable, and therefore indexable, as a normal URL.
error_page 404 /404.html;
location = /404.html {
    internal;
}

# --- Old English-at-root URLs → /en/... ------------------------------------
#
# DO NOT add a redirect for "/" itself. It correctly serves the Arabic home
# page at 200 — that is the whole point of the Arabic-first decision. Only
# the more specific old-English paths below are redirected.
#
# Each rule points straight at its final target, so there is exactly one hop
# (no chaining through the old path first).
location = /about-sanramon/          { return 301 /en/about-sanramon/; }
location = /message/                 { return 301 /en/message/; }
location = /careers/                 { return 301 /en/careers/; }
location = /our-brands/              { return 301 /en/our-brands/; }
location = /brands/oil-gas/          { return 301 /en/brands/oil-gas/; }
location = /brands/products/         { return 301 /en/brands/products/; }
location = /brands/food-beverages/   { return 301 /en/brands/food-beverages/; }
location = /brands/cafe-restaurants/ { return 301 /en/brands/cafe-restaurants/; }
location = /brands/beauty/           { return 301 /en/brands/beauty/; }
location = /brands/interior-design/  { return 301 /en/brands/interior-design/; }

# Same paths without the trailing slash (WordPress emitted both in places).
location = /about-sanramon           { return 301 /en/about-sanramon/; }
location = /message                  { return 301 /en/message/; }
location = /careers                  { return 301 /en/careers/; }
location = /our-brands               { return 301 /en/our-brands/; }

# --- Old /ar/... URLs → root Arabic URLs (drop the /ar/ prefix) ------------
#
# One rule covers all 11 Arabic pages including their Arabic slugs. nginx
# decodes the URI before matching and re-encodes when building the Location
# header, so percent-encoded Arabic passes through — but VERIFY after
# deploying (see the smoke test in DEPLOYMENT.md): a proxy or WAF in front
# that double-encodes or normalises these paths is the most common breakage.
location = /ar  { return 301 /; }
location = /ar/ { return 301 /; }
location ^~ /ar/ {
    rewrite ^/ar/(.*)$ /$1 permanent;
}

# --- Dropped WordPress URLs → home ----------------------------------------
# 25 bare client-logo attachment pages, WP widget internals, author archives.
#
# The client pages land on the client logo wall rather than the top of the home
# page, so a visitor following an old link sees the thing they came for. The
# fragment is a USABILITY device only: search engines strip `#...` and treat
# all of these as redirects to `/`. It changes nothing about how they rank.
location ^~ /client/ { return 301 /#clients; }
location ^~ /footer/ { return 301 /; }
location ^~ /author/ { return 301 /; }

# Available in-page anchors, should you need more redirect targets:
#   Home (`/` and `/en/`):  #top  #about-us  #departments  #brands-main
#                           #clients  #careers
#   Category pages:         one per brand card, slugified from the brand name
#                           (e.g. /en/brands/oil-gas/#phe-polymers). Repeated
#                           names are suffixed -2, -3 (see categoryAnchors()
#                           in src/data/brands.ts). Current ids:
#     oil-gas          chase phe-polymers ast chase-2 syno-pumps
#                      cpi-fluid-engineering nuova-general-instrument
#     products         kif-al-mosafer najdiya karak-tea capri finjan-al-arab
#                      food-hacks
#     food-beverages   capri capri-catering kakawna jacket-potato-hot-dogs
#     cafe-restaurants capri jacket-potato-hot-dogs
#     beauty           bella-terra-cosmetics marshmallows-nail-spa
#     interior-design  fit-out
#
# The Arabic category pages carry the SAME anchor ids (the slug is built from
# the brand's Latin name, which is shared across locales).

# Old WordPress ?p=<id> shortlinks (e.g. /?p=123).
#
# Matched on $request_uri so it fires ONLY on the root with a ?p= parameter.
# A bare `if ($arg_p)` at server level would also catch any legitimate URL
# carrying a ?p= parameter (/en/careers/?p=1 would bounce to the homepage).
# Deliberately NOT written as `location = / { ... }` — that would override the
# existing root/index handling in this server block and risk 404ing the
# homepage. `if` + `return` at server level is one of the documented-safe
# uses of `if`.
if ($request_uri ~ "^/\?p=") {
    return 301 /;
}

# --- STILL MISSING: individual brand CPT permalinks -----------------------
# DEPLOYMENT.md also requires 301s for the old per-brand permalinks
# (/product-2/, /oil-gas-1/, /beauty-1/, … and their Arabic equivalents).
# Those old slugs are not recoverable from this repo — export them from Google
# Search Console ("Pages" → indexed URLs) or the old WordPress sitemap, then
# add one line each, targeting the brand's own card:
#     location = /<old-slug>/ { return 301 /en/brands/<category>/#<brand>; }
# e.g. location = /oil-gas-1/ { return 301 /en/brands/oil-gas/#chase; }
#
# Point each at its OWN category (not the home page): a redirect to a
# topically relevant page consolidates its link signals into that page,
# whereas mass-redirecting unrelated URLs to `/` is treated as a soft 404 and
# the value is discarded. The `#<brand>` part is for the visitor only.
#
# Until these are added they fall through to the custom 404 above, which is
# correct behaviour but forfeits their inbound link value.
